services:
  - type: web
    name: salesai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: IS_PROD
        value: "1"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_PASSWORD
        sync: false
